<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>User List</title>
</head>

<body>

  <header>
    <div class="d-flex justify-content-end container mt-5  ">
      <div class="btn-group">
        <button type="button" data-bs-theme-value="dark" class="btn btn-secondary btn-sm mb-5">Dark</button>
        <button type="button" data-bs-theme-value="light" class="btn btn-light btn-sm mb-5">Light</button>
      </div>
    </div>
    <div class="container mb-4">
      <h1 class="mb-4">Users</h1>

      >
      <div class="row align-items-center">
        <div class="col-md-4 mb-3 mb-md-0">
          <input type="text" class="form-control form-control-lg" placeholder="Search Users">
        </div>
        <div class="col-md-8">
          <ul class="nav user-menu d-flex justify-content-end align-items-center gap-3 list-unstyled mb-0">
            <li><a href="#" class="text-decoration-none text-secondary">Reputation</a></li>
            <li><a href="#" class="text-decoration-none text-bg-primary rounded-3 px-3 py-2">New Users</a></li>
            <li><a href="#" class="text-decoration-none text-secondary">Editors</a></li>
            <li><a href="#" class="text-decoration-none text-secondary">Moderators</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>
  <main>
    <section>
      <div class="row">
        <div class="col-md-4 mb-3">
          <div class="card mb-3 h-100">
            <div class="card-body">
              <div class="d-flex gap-3 align-items-center">
                <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="John Doe"
                  class="img-fluid rounded-circle" style="width: 70px; height: 70px; object-fit: cover;">
                <div>
                  <h5 class="card-title mb-1">
                    <a href="#" class="text-decoration-none text-dark" data-bs-toggle="popover"
                      data-bs-title="User Email" data-bs-content="john@gmail.com">John Doe</a>
                  </h5>
                  <p class="card-text text-muted mb-2">Troy, MI</p>
                  <div>
                    <span class="badge text-bg-secondary">Nature</span>
                    <span class="badge text-bg-secondary">Travel</span>
                    <span class="badge text-bg-secondary">Sport</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="card mb-3 h-100">
            <div class="card-body">
              <div class="d-flex gap-3 align-items-center">
                <img src="https://randomuser.me/api/portraits/women/75.jpg" alt="Lehla Nichols"
                  class="img-fluid rounded-circle" style="width: 70px; height: 70px; object-fit: cover;">
                <div>
                  <h5 class="card-title mb-1">
                    <a href="#" class="text-decoration-none text-dark" data-bs-toggle="popover"
                      data-bs-title="User Email" data-bs-content="lehla@gmail.com">Lehla Nichols</a>
                  </h5>
                  <p class="card-text text-muted mb-2">Fort Worth, TX</p>
                  <div>
                    <span class="badge text-bg-secondary">Fashion</span>
                    <span class="badge text-bg-secondary">STEM</span>
                    <span class="badge text-bg-secondary">Architecture</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="card mb-3 h-100">
            <div class="card-body">
              <div class="d-flex gap-3 align-items-center">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Annie Rice"
                  class="img-fluid rounded-circle" style="width: 70px; height: 70px; object-fit: cover;">
                <div>
                  <h5 class="card-title mb-1">
                    <a href="#" class="text-decoration-none text-dark" data-bs-toggle="popover"
                      data-bs-title="User Email" data-bs-content="annie@gmail.com">Annie Rice</a>
                  </h5>
                  <p class="card-text text-muted mb-2">Troy, MI</p>
                  <div>
                    <span class="badge text-bg-secondary">Electronics</span>
                    <span class="badge text-bg-secondary">Tech</span>
                    <span class="badge text-bg-secondary">Music</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/darkmodetoggle.js"></script>
  <script>
    const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
    const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
  </script>
</body>

</html>
